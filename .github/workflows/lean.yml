name: Lean

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          use-github-cache: false
      - name: Generate Lake manifest
        run: lake update
      - name: Build
        run: lake build
